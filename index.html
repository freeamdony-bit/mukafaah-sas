<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Mukafaah SAS - SDIT Alia Nurul Jihadi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 28px 16px;
      font-size: 17px;
    }
    .container {
      max-width: 820px;
      margin: auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 28px;
      line-height: 1.3;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 17px;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 17px;
    }
    input:focus {
      outline: none;
      border-color: #15803d;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    hr {
      border: none;
      border-top: 1px solid #cbd5e1;
      margin: 24px 0;
    }
    button {
      background: #15803d;
      color: #ffffff;
      border: none;
      padding: 15px 22px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #166534;
    }
    .hasil-box {
      display: none;
      margin-top: 28px;
      padding: 24px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
    }
    .hasil-box h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 22px;
    }
    .rincian-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed #cbd5e1;
      font-size: 16px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding-top: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #15803d;
    }
    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 22px;
      }
      h1 {
        font-size: 24px;
      }
      .rincian-item {
        flex-direction: column;
      }
      .total-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Form Input Mukafaah SAS</h1>

    <div class="field">
      <label>1. Nama</label>
      <input type="text" id="nama" placeholder="Contoh: Upik Butsiani, S.Psi" />
    </div>

    <div class="field">
      <label>2. Wali Kelas / Guru Bidang</label>
      <input type="text" id="jabatan" placeholder="Contoh: Wali Kelas 1A / Guru Matematika" />
    </div>

    <div class="grid-2">
      <div class="field">
        <label>3. Nomor WA</label>
        <input type="text" id="wa" placeholder="Contoh: 0812xxxxxxxx" />
      </div>
      <div class="field">
        <label>Jenis Bank</label>
        <input type="text" id="jenis_bank" placeholder="Contoh: BSI / BCA / BRI / Mandiri" />
      </div>
    </div>

    <div class="field">
      <label>4. Nomor Rekening</label>
      <input type="text" id="rekening" placeholder="Contoh: 7205xxxxxx" />
    </div>

    <hr />

    <div class="grid-2">
      <div class="field">
        <label>5. Membuat soal sebanyak</label>
        <input type="number" id="buat_soal" min="0" value="0" />
      </div>
      <div class="field">
        <label>6. Mengoreksi soal sebanyak (siswa)</label>
        <input type="number" id="koreksi_soal" min="0" value="0" />
      </div>
      <div class="field">
        <label>7. Mengawas praktek sebanyak (siswa)</label>
        <input type="number" id="awas_praktek" min="0" value="0" />
      </div>
      <div class="field">
        <label>8. Mengawas ruangan sebanyak</label>
        <input type="number" id="awas_ruang" min="0" value="0" />
      </div>
      <div class="field">
        <label>9. Mengisi raport sebanyak (siswa)</label>
        <input type="number" id="isi_raport" min="0" value="0" />
      </div>
      <div class="field">
        <label>10. Editing soal dan Packing (rombel)</label>
        <input type="number" id="edit_packing" min="0" value="0" />
      </div>
    </div>

    <div class="field">
      <label>11. Guru Pendamping</label>
      <input type="number" id="guru_pendamping" min="0" value="0" />
    </div>

    <button type="button" onclick="hitungMukafaah()">Hitung Mukafaah</button>

    <div class="hasil-box" id="hasilBox">
      <h2>Rincian Mukafaah SAS</h2>
      <div id="infoPegawai" style="margin-bottom: 14px; font-size: 16px;"></div>
      <div id="rincianList"></div>
      <div class="total-row">
        <span>Total Mukafaah</span>
        <span id="totalRupiah">Rp 0</span>
      </div>
    </div>
  </div>

  <script>
    const TARIF = {
      buat_soal: 45000,
      koreksi_soal: 3000,
      awas_praktek: 2000,
      awas_ruang: 17000,
      isi_raport: 10000,
      edit_packing: 170000,
      guru_pendamping: 150000
    };

    function formatRupiah(angka) {
      return "Rp " + Number(angka || 0).toLocaleString("id-ID");
    }

    function ambilAngka(id) {
      const nilai = parseFloat(document.getElementById(id).value);
      return isNaN(nilai) || nilai < 0 ? 0 : nilai;
    }

    function hitungMukafaah() {
      const nama = document.getElementById("nama").value.trim() || "-";
      const jabatan = document.getElementById("jabatan").value.trim() || "-";
      const wa = document.getElementById("wa").value.trim() || "-";
      const bank = document.getElementById("jenis_bank").value.trim() || "-";
      const rekening = document.getElementById("rekening").value.trim() || "-";

      const items = [
        { label: "Membuat soal", satuan: "soal", jumlah: ambilAngka("buat_soal"), tarif: TARIF.buat_soal },
        { label: "Mengoreksi soal", satuan: "siswa", jumlah: ambilAngka("koreksi_soal"), tarif: TARIF.koreksi_soal },
        { label: "Mengawas praktek", satuan: "siswa", jumlah: ambilAngka("awas_praktek"), tarif: TARIF.awas_praktek },
        { label: "Mengawas ruangan", satuan: "ruangan", jumlah: ambilAngka("awas_ruang"), tarif: TARIF.awas_ruang },
        { label: "Mengisi raport", satuan: "siswa", jumlah: ambilAngka("isi_raport"), tarif: TARIF.isi_raport },
        { label: "Editing soal dan Packing", satuan: "rombel", jumlah: ambilAngka("edit_packing"), tarif: TARIF.edit_packing },
        { label: "Guru Pendamping", satuan: "kegiatan", jumlah: ambilAngka("guru_pendamping"), tarif: TARIF.guru_pendamping }
      ];

      let total = 0;
      let htmlRincian = "";

      items.forEach((item) => {
        const subtotal = item.jumlah * item.tarif;
        total += subtotal;
        htmlRincian += `
          <div class="rincian-item">
            <span>${item.label} (${item.jumlah} ${item.satuan} × ${formatRupiah(item.tarif)})</span>
            <strong>${formatRupiah(subtotal)}</strong>
          </div>
        `;
      });

      document.getElementById("infoPegawai").innerHTML = `
        <div><strong>Nama:</strong> ${nama}</div>
        <div><strong>Jabatan:</strong> ${jabatan}</div>
        <div><strong>No. WA:</strong> ${wa}</div>
        <div><strong>Bank & Rekening:</strong> ${bank} - ${rekening}</div>
      `;

      document.getElementById("rincianList").innerHTML = htmlRincian;
      document.getElementById("totalRupiah").textContent = formatRupiah(total);
      document.getElementById("hasilBox").style.display = "block";
    }
  </script>
</body>
</html>
