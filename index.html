<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Mukafaah SAS - SDIT Alia Nurul Jihadi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 28px 16px;
      font-size: 17px;
    }
    .container {
      max-width: 820px;
      margin: auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 28px;
      line-height: 1.3;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 17px;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 17px;
    }
    input:focus {
      outline: none;
      border-color: #15803d;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    hr {
      border: none;
      border-top: 1px solid #cbd5e1;
      margin: 24px 0;
    }
    button {
      background: #15803d;
      color: #ffffff;
      border: none;
      padding: 15px 22px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #166534;
    }
    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 22px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Form Input Mukafaah SAS (Tahap 1)</h1>

    <div class="field">
      <label>1. Nama</label>
      <input type="text" id="nama" placeholder="Contoh: Upik Butsiani, S.Psi" />
    </div>

    <div class="field">
      <label>2. Wali Kelas / Guru Bidang</label>
      <input type="text" id="jabatan" placeholder="Contoh: Wali Kelas 1A / Guru Matematika" />
    </div>

    <div class="grid-2">
      <div class="field">
        <label>3. Nomor WA</label>
        <input type="text" id="wa" placeholder="Contoh: 0812xxxxxxxx" />
      </div>
<div class="field">
        <label>Jenis Bank</label>
        <input type="text" id="jenis_bank" placeholder="Contoh: BSI / BCA / BRI / Mandiri" />
      </div>
      <div class="field">
        <label>4. Nomor Rekening</label>
        <input type="text" id="rekening" placeholder="Contoh: 7205xxxxxx" />
      </div>
    </div>

    <hr />

    <div class="grid-2">
      <div class="field">
        <label>5. Membuat soal sebanyak</label>
        <input type="number" id="buat_soal" min="0" value="0" />
      </div>
      <div class="field">
        <label>6. Mengoreksi soal sebanyak (siswa)</label>
        <input type="number" id="koreksi_soal" min="0" value="0" />
      </div>
      <div class="field">
        <label>7. Mengawas praktek sebanyak (siswa)</label>
        <input type="number" id="awas_praktek" min="0" value="0" />
      </div>
      <div class="field">
        <label>8. Mengawas ruangan sebanyak</label>
        <input type="number" id="awas_ruang" min="0" value="0" />
      </div>
      <div class="field">
        <label>9. Mengisi raport sebanyak (siswa)</label>
        <input type="number" id="isi_raport" min="0" value="0" />
      </div>
      <div class="field">
        <label>10. Editing soal dan Packing (rombel)</label>
        <input type="number" id="edit_packing" min="0" value="0" />
      </div>
    </div>

    <div class="field">
      <label>11. Guru Pendamping</label>
      <input type="number" id="guru_pendamping" min="0" value="0" />
    </div>

    <button type="button" onclick="cekData()">Submit</button>
  </div>

  <script>
    function cekData() {
      const nama = document.getElementById("nama").value;
      alert("Data awal terbaca untuk: " + (nama || "(belum diisi)") + ". Lanjut ke Tahap 2 untuk hitung otomatis!");
    }
  </script>
</body>
</html>
